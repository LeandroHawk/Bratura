name: CI

# Pull requests only: a merge into main or dev carries code a PR already checked
# (the dev → main release PR runs on the same tree), so a push run would repeat it.
on:
  pull_request:

# A new push to the same PR cancels the run it made obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's merge commit and its base, so the next step sees what the PR adds.
          fetch-depth: 2
      # QA evidence goes in the PR body, never in the tree: once merged, a binary stays in the
      # history forever.
      - name: Refuse QA artefacts and large files
        run: |
          status=0
          while IFS= read -r file; do
            case "$file" in
              docs/qa/* | *.py | *.cjs)
                echo "::error file=$file::QA artefact or one-off script; describe it in the PR body" ;;
              docs/readme/* | apps/web/public/*) continue ;;
              *.png | *.jpg | *.jpeg | *.gif | *.webp | *.avif | *.mp4 | *.webm | *.mov | *.pdf | *.zip)
                echo "::error file=$file::media only in docs/readme/ or apps/web/public/" ;;
              *) [ "$file" = pnpm-lock.yaml ] || [ "$(wc -c < "$file")" -le 300000 ] && continue
                echo "::error file=$file::over 300 kB" ;;
            esac
            status=1
          done < <(git diff --name-only --no-renames --diff-filter=AM HEAD^1 HEAD)
          exit $status
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
