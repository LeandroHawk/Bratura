name: CI

# Pull requests only: a merge into main or dev carries code a PR already checked
# (the dev → main release PR runs on the same tree), so a push run would repeat it.
on:
  pull_request:

# A new push to the same PR cancels the run it made obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
